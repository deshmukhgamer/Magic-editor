<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magic AI Editor v3</title>
  <style>
    :root {
      --bg: #0d0f17;
      --card: #161b26;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #262f40;
      --user-msg: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header */
    header { padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .status-badge { font-size: 0.75rem; background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 4px 8px; border-radius: 12px; font-weight: 600; }

    /* API Key Banner */
    #api-banner { background: #1e1b4b; border-bottom: 1px solid #3730a3; padding: 10px 16px; display: flex; gap: 8px; font-size: 0.85rem; align-items: center; }
    #api-banner input { flex: 1; background: #0f172a; border: 1px solid #312e81; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; }
    #api-banner button { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }

    /* Chat Area */
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user-msg); color: white; border-bottom-right-radius: 2px; }
    .msg.ai { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .plan-box { background: #0f172a; border: 1px dashed var(--accent); padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 0.8rem; font-family: monospace; white-space: pre-wrap; }

    /* Presets Carousel */
    .presets { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; background: rgba(22, 27, 38, 0.8); scrollbar-width: none; }
    .presets::-webkit-scrollbar { display: none; }
    .chip { background: var(--card); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; white-space: nowrap; cursor: pointer; }
    .chip:active { background: var(--accent); color: white; }

    /* Input Footer */
    footer { padding: 10px 16px; background: var(--card); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    .attach-btn { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #msg-input { flex: 1; background: #0b0e14; border: 1px solid var(--border); color: white; padding: 10px 14px; border-radius: 20px; font-size: 0.9rem; outline: none; }
    #msg-input:focus { border-color: var(--accent); }
    .send-btn { background: var(--accent); color: white; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Magic AI Editor</h1>
    <span class="status-badge" id="app-status">Standalone</span>
  </header>

  <div id="api-banner">
    <input type="password" id="gemini-key" placeholder="Enter Gemini API Key...">
    <button onclick="saveKey()">Save</button>
  </div>

  <div id="chat-container">
    <div class="msg ai">
      नमस्ते! मैं <b>Magic AI Video Editor</b> हूँ। आप मुझे वीडियो आइडिया, रील कांसेप्ट्स या एडिटिंग स्टाइल्स बता सकते हैं। नीचे दिए गए प्रीसेट्स का इस्तेमाल करें या अपना प्रॉम्प्ट लिखें!
    </div>
  </div>

  <div class="presets">
    <div class="chip" onclick="quickSend('Velocity Edit with Phonk sync')">⚡ Velocity Edit</div>
    <div class="chip" onclick="quickSend('Cinematic Color Grade plan')">🎨 Cinematic Grade</div>
    <div class="chip" onclick="quickSend('Suggest Dark Phonk Music query')">🎵 Phonk Music</div>
    <div class="chip" onclick="quickSend('Headlight Glow & Motion Blur')">✨ Car Glow Edit</div>
  </div>

  <footer>
    <div class="input-row">
      <input type="file" id="video-file" accept="video/*" style="display:none" onchange="fileSelected(this)">
      <button class="attach-btn" onclick="document.getElementById('video-file').click()">➕</button>
      <input type="text" id="msg-input" placeholder="Type instructions or ideas..." onkeydown="if(event.key==='Enter') send()">
      <button class="send-btn" onclick="send()">➤</button>
    </div>
  </footer>

  <script>
    let API_KEY = localStorage.getItem("GEMINI_KEY") || "";
    if (API_KEY) document.getElementById("gemini-key").value = API_KEY;

    function saveKey() {
      const k = document.getElementById("gemini-key").value.trim();
      if (!k) return alert("Please enter a valid key!");
      localStorage.setItem("GEMINI_KEY", k);
      API_KEY = k;
      alert("API Key Saved!");
    }

    function appendMessage(text, sender, isPlan = false) {
      const box = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      if (isPlan) {
        div.innerHTML = `<div>${text.summary || "AI Blueprint Ready"}</div><pre class="plan-box">${JSON.stringify(text, null, 2)}</pre>`;
      } else {
        div.innerText = text;
      }
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function quickSend(txt) {
      document.getElementById("msg-input").value = txt;
      send();
    }

    function fileSelected(input) {
      if (input.files.length > 0) {
        appendMessage(`Attached video: ${input.files[0].name}`, "user");
        appendMessage(`Video received (${input.files[0].name}). Ab bataiye ispe kaisa edit karna hai? (e.g., Velocity, Reel, Cinematic)`, "ai");
      }
    }

    async function send() {
      const input = document.getElementById("msg-input");
      const userText = input.value.trim();
      if (!userText) return;

      if (!API_KEY) {
        alert("Please enter and save your Gemini API Key at the top first!");
        return;
      }

      appendMessage(userText, "user");
      input.value = "";

      const systemPrompt = `You are Magic AI, a world-class autonomous video editor assistant. 
Reply concisely in simple Hinglish or English.
For video edits, give concrete steps: speed ramps, cuts, SFX, and color grading. 
Always output clean, actionable advice.`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${systemPrompt}\n\nUser: ${userText}` }] }]
          })
        });

        const data = await res.json();
        if (data.candidates && data.candidates[0].content) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage(reply, "ai");
        } else {
          appendMessage("Error: AI reply could not be generated. Check your API key.", "ai");
        }
      } catch (e) {
        appendMessage("Network/API Error: " + e.message, "ai");
      }
    }
  </script>
</body>
</html>
