<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Deshmukh Gamer - Magic Video Editor</title>
<style>
:root{--bg:#070b12;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--neon:#00ffa3;--cyan:#00c2ff;--vio:#7c5cff;--txt:#e6eef8;--mut:#8493a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--txt);font:15px/1.45 system-ui,-apple-system,sans-serif;
background:radial-gradient(600px 400px at 10% -5%,#00ffa322,transparent),radial-gradient(500px 400px at 100% 10%,#7c5cff26,transparent),var(--bg);
padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:auto}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--neon),var(--cyan));box-shadow:0 0 22px #00ffa355}
.top h1{margin:0;font-size:21px;letter-spacing:-.01em}
.badge{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;letter-spacing:.14em;padding:3px 9px;border-radius:99px;color:#00110a;background:linear-gradient(90deg,var(--neon),var(--cyan))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mut);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.lbl:first-child{margin-top:0}.lbl i{font-style:normal;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:11px;color:#00110a;background:linear-gradient(135deg,var(--neon),var(--cyan))}
input[type=password],input[type=text],select,textarea{width:100%;background:rgba(0,0,0,.35);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px #00ffa322}
textarea{min-height:96px;resize:vertical}
