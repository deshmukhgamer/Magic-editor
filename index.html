<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic AI Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { background: #151c2c; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232f48; }
    header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .badge { background: #1e293b; color: #94a3b8; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; }
    
    .settings-bar { background: #101726; padding: 10px 16px; display: flex; gap: 8px; border-bottom: 1px solid #1e293b; align-items: center; flex-wrap: wrap; }
    select, input { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }
    select { cursor: pointer; }
    input { flex: 1; min-width: 140px; }
    .btn-save { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    
    .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg.ai { align-self: flex-start; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .msg.error { background: #451a1a; color: #f87171; border: 1px solid #7f1d1d; }

    .quick-actions { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; background: #0b0f19; }
    .chip { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; cursor: pointer; }

    .input-bar { background: #151c2c; padding: 12px 16px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #232f48; }
    .input-bar input { border-radius: 20px; padding: 10px 16px; }
    .btn-send { background: #3b82f6; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Magic AI Editor</h1>
    <span class="badge">Standalone</span>
  </header>

  <!-- Provider & API Key Setup -->
  <div class="settings-bar">
    <select id="modelProvider">
      <option value="groq">Llama 3 (Free Groq)</option>
      <option value="gemini">Gemini API</option>
    </select>
    <input type="password" id="apiKeyInput" placeholder="Enter API Key...">
    <button class="btn-save" onclick="saveApiKey()">Save</button>
  </div>

  <!-- Chat History -->
  <div class="chat-container" id="chatArea">
    <div class="msg ai">नमस्ते! मैं <b>Magic AI Video Editor</b> हूँ। आप मुझे वीडियो आइडिया, रील कॉन्सेप्ट्स या एडिटिंग स्टाइल्स बता सकते हैं। नीचे दिए गए प्रीसेट्स का इस्तेमाल करें या अपना प्रॉम्प्ट लिखें!</div>
  </div>

  <!-- Quick Prompts -->
  <div class="quick-actions">
    <div class="chip" onclick="quickSend('Velocity Edit with Phonk sync')">⚡ Velocity Edit</div>
    <div class="chip" onclick="quickSend('Cinematic Color Grade plan')">🎨 Cinematic Grade</div>
    <div class="chip" onclick="quickSend('Viral Gaming Reel Hook idea')">🔥 Viral Reel Hook</div>
  </div>

  <!-- User Input -->
  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type instructions or ideas..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="btn-send" onclick="sendMessage()">➤</button>
  </div>

  <script>
    // Load stored key
    document.addEventListener("DOMContentLoaded", () => {
      const savedProvider = localStorage.getItem("selected_provider") || "groq";
      document.getElementById("modelProvider").value = savedProvider;
      loadKeyForProvider(savedProvider);
    });

    document.getElementById("modelProvider").addEventListener("change", (e) => {
      localStorage.setItem("selected_provider", e.target.value);
      loadKeyForProvider(e.target.value);
    });

    function loadKeyForProvider(provider) {
      const key = localStorage.getItem(`api_key_${provider}`) || "";
      document.getElementById("apiKeyInput").value = key;
    }

    function saveApiKey() {
      const provider = document.getElementById("modelProvider").value;
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) {
        alert("कृपया API Key दर्ज करें!");
        return;
      }
      localStorage.setItem(`api_key_${provider}`, key);
      alert(`${provider.toUpperCase()} API Key सुरक्षित रूप से सेव हो गई!`);
    }

    function addMessage(text, type) {
      const chatArea = document.getElementById("chatArea");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${type}`;
      msgDiv.innerHTML = text.replace(/\n/g, '<br>');
      chatArea.appendChild(msgDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function quickSend(text) {
      document.getElementById("userInput").value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      const provider = document.getElementById("modelProvider").value;
      const apiKey = localStorage.getItem(`api_key_${provider}`);

      if (!apiKey) {
        addMessage(`Error: कृपया पहले ऊपर ${provider.toUpperCase()} API Key डालकर Save करें।`, "error");
        return;
      }

      addMessage("सोच रहा हूँ...", "ai");
      const loadingMsg = document.getElementById("chatArea").lastChild;

      try {
        let reply = "";
        if (provider === "groq") {
          // Free Groq Llama 3 API (No billing/credit card needed)
          const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: "llama-3.1-8b-instant",
              messages: [
                { role: "system", content: "You are Magic AI Video Editor. Provide creative, short, impactful video editing ideas and prompts in Hindi/Hinglish." },
                { role: "user", content: text }
              ]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.choices[0].message.content;
        } else {
          // Gemini API Call
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: text }] }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.candidates[0].content.parts[0].text;
        }

        loadingMsg.innerHTML = reply.replace(/\n/g, '<br>');
      } catch (err) {
        loadingMsg.className = "msg error";
        loadingMsg.innerText = "Error: AI reply could not be generated. Check your API key. (" + err.message + ")";
      }
    }
  </script>
</body>
</html>
